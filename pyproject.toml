[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "atrxl-calculator"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = ["xraydb==4.5.8", "numpy", "scipy", "pandas", "streamlit", "plotly", "matplotlib", "xarray"]
[project.optional-dependencies]
test = ["pytest"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.setuptools.package-data]
atrxl = ["data_sources/*"]
